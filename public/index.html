<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headpilot</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <!-- für den "netzwerk"-reiter (graph-visualisierung des tailnets) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/10.1.2/dist/dist/vis-network.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-header">Headpilot</div>
            <div class="nav-section-label">Headscale</div>
            <ul class="nav-links">
                <li><a href="#" id="nav-dashboard" onclick="loadView('dashboard')">Startseite (Übersicht)</a></li>
                <li><a href="#" id="nav-nodes" onclick="loadView('nodes')">Geräte (Nodes)</a></li>
                <li><a href="#" id="nav-users" onclick="loadView('users')">Benutzer (Users)</a></li>
                <li><a href="#" id="nav-keys" onclick="loadView('keys')">Pre-Auth Keys</a></li>
                <li><a href="#" id="nav-routes" onclick="loadView('routes')">Subnet Routes</a></li>
            </ul>
            <div class="nav-section-label">Weitere Dienste</div>
            <ul class="nav-links">
                <li><a href="#" id="nav-docker" onclick="loadView('docker')">Docker Dienste</a></li>
                <li><a href="#" id="nav-status" onclick="loadView('status')">Status</a></li>
            </ul>
        </div>

        <div class="sidebar-bottom">
            <div class="sidebar-user" id="sidebar-user" hidden>
                <span class="sidebar-user-avatar" id="sidebar-user-avatar"></span>
                <span class="sidebar-user-name" id="sidebar-user-name"></span>
            </div>
            <a href="/logout" class="btn-logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Abmelden
            </a>
        </div>
    </aside>

    <main class="main-content" id="app-content">
        <h2>Lade Anwendung...</h2>
    </main>

    <div class="modal-overlay" id="ssh-modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ssh-modal-title">
            <h3 id="ssh-modal-title">SSH-Zugang</h3>
            <p class="modal-subtitle" id="ssh-modal-subtitle"></p>
            <form id="ssh-form">
                <label class="modal-field">
                    Benutzername
                    <input type="text" id="ssh-username" autocomplete="username" required>
                </label>
                <label class="modal-field">
                    Passwort
                    <input type="password" id="ssh-password" autocomplete="current-password" required>
                </label>
                <label class="modal-field modal-checkbox-field">
                    <input type="checkbox" id="ssh-remember">
                    Zugangsdaten sicher verschlüsselt speichern (kein erneuter Login nötig)
                </label>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeSshModal()">Abbrechen</button>
                    <button type="submit" class="btn btn-primary">Verbinden</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="monitor-modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="monitor-modal-title">
            <h3 id="monitor-modal-title">Dienst hinzufügen</h3>
            <form id="monitor-form">
                <label class="modal-field">
                    Name
                    <input type="text" id="monitor-name" required>
                </label>
                <label class="modal-field">
                    Typ
                    <select id="monitor-type" onchange="updateMonitorFormFields()">
                        <option value="http">HTTP(S)</option>
                        <option value="port">TCP-Port</option>
                        <option value="ping">Ping</option>
                    </select>
                </label>
                <label class="modal-field">
                    <span id="monitor-target-label">URL</span>
                    <input type="text" id="monitor-target" required>
                </label>
                <label class="modal-field" id="monitor-port-field">
                    Port
                    <input type="number" id="monitor-port" min="1" max="65535">
                </label>
                <label class="modal-field">
                    Prüfintervall (Sekunden)
                    <input type="number" id="monitor-interval" min="20" value="60">
                </label>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeMonitorModal()">Abbrechen</button>
                    <button type="submit" class="btn btn-primary" id="monitor-form-submit">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/10.1.2/standalone/umd/vis-network.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
